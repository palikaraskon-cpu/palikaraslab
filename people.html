
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Members | Palikaras Lab</title>
<style>

/* Unified Palikaras Lab navigation */

.site-header {
  background: #ffffff;
  border-bottom: 1px solid #e1e8e7;
  padding: 16px 5%;
}

.site-nav {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.site-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: #172d39;
  font-size: 22px;
  font-weight: 700;
  white-space: nowrap;
  margin-right: auto;
}

.site-brand img {
  width: 44px;
  height: 44px;
  object-fit: contain;
}

.site-links {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 22px;
}

.site-links a {
  color: #172d39;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
}

.site-links a:hover {
  color: #168b80;
}

@media (max-width: 900px) {
  .site-nav {
    flex-direction: column;
    align-items: flex-start;
  }

  .site-links {
    justify-content: flex-start;
    gap: 14px;
  }
}
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7faf9;
  color: #172d39;
}

header {
  background: white;
  border-bottom: 1px solid #e1e8e7;
  padding: 22px 5%;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 60px 25px;
}

h1 {
  font-size: 44px;
  margin: 0 0 12px;
}

.intro {
  color: #60737b;
  margin-bottom: 40px;
}

.people-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
}

.person {
  background: white;
  border: 1px solid #e3e9e8;
  border-radius: 8px;
  overflow: hidden;
}

.person img {
  width: 100%;
  height: 310px;
  object-fit: cover;
  display: block;
}

.person-info {
  padding: 20px;
}

.person h3 {
  margin: 0 0 8px;
  font-size: 20px;
}

.person p {
  margin: 0;
  color: #65757c;
}

@media (max-width: 800px) {
  .people-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 520px) {
  .people-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>


<header class="site-header">
  <nav class="site-nav">

    <a class="site-brand" href="index.html">
      <img src="images/logo.jpg" alt="Palikaras Lab logo">
      <span>Palikaras Lab</span>
    </a>

    <div class="site-links">
      <a href="index.html#about">About</a>
      <a href="index.html#research">Research</a>
      <a href="index.html#microscopy">Microscopy</a>
      <a href="people.html">People</a>
      <a href="alumni.html">Alumni</a>
      <a href="publications.html">Publications</a>
      <a href="funding.html">Funding</a>
      <a href="contact.html">Contact</a>
    </div>

  </nav>
</header>


<main class="container">

<h1>Meet the People</h1>
<p class="intro">
Researchers and students advancing our understanding
of mitochondrial and neuronal biology.
</p>

<div class="people-grid" id="people-grid"></div>

</main>

<script>
const members = [
  ["Konstantinos Palikaras", "Principal Investigator · Associate Professor", "person-00.jpg"],
  ["Christina Ploumi", "Postdoctoral Researcher", "person-01.jpg"],
  ["Nikolaos Tataridas-Pallas", "Postdoctoral Researcher", "person-02.jpg"],
  ["Christina Doxaki", "Postdoctoral Researcher", "person-03.jpg"],
  ["Antonis Roussos", "Graduate Student", "person-04.jpg"],
  ["Eirini Mytilinaiou", "Graduate Student", "person-05.jpg"],
  ["Nefeli Kalogeraki", "Graduate Student", "person-06.jpg"],
  ["Eirini Karapidaki", "Graduate Student", "person-07.jpg"],
  ["Jiani Huang", "Graduate Student", "person-08.jpg"],
  ["Colby Fair", "Graduate Student", "person-09.jpg"],
  ["Stathis Athanasiou", "Graduate Student", "person-10.jpg"], 
  ["Haijun He", "Graduate Student", "person-11.jpg"], 
  ["Alicia Mucaj", "Graduate Student", "person-12.png"],
  
];

const grid = document.getElementById("people-grid");

members.forEach(function(member) {
  const card = document.createElement("article");
  card.className = "person";

  const img = document.createElement("img");
  img.src = "images/" + member[2];
  img.alt = "Portrait of " + member[0];
  img.loading = "lazy";

  const info = document.createElement("div");
  info.className = "person-info";

  const name = document.createElement("h3");
  name.textContent = member[0];

  const role = document.createElement("p");
  role.textContent = member[1];

  info.appendChild(name);
  info.appendChild(role);
  card.appendChild(img);
  card.appendChild(info);
  grid.appendChild(card);
});
</script>

</body>
</html>
