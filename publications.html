
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications | Palikaras Lab</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #152a36;
      background: #ffffff;
      line-height: 1.6;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e9e8;
      padding: 20px 5%;
    }

    nav {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: #152a36;
      font-weight: bold;
      font-size: 14px;
    }

    nav a:hover {
      color: #177f77;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 55px 25px;
    }

    h1 {
      font-size: 44px;
      margin-bottom: 10px;
    }

    .publication {
      padding: 22px 0;
      border-bottom: 1px solid #e2e9e8;
    }

    .publication h3 {
      font-size: 20px;
      margin: 0 0 8px;
    }

    .publication p {
      margin: 5px 0;
      color: #587079;
    }

    .publication a {
      color: #177f77;
    }
  </style>

  <script src="publications.js?v=20261116"></script>
</head>

<body>

<header>
  <nav>
<a href="#about">About</a>
  <a href="#research">Research</a>
  <a href="#microscopy">Microscopy</a>
  <a href="people.html">People</a>
  <a href="alumni.html">Alumni</a>
  <a href="publications.html">Publications</a>
  <a href="funding.html">Funding</a>
  <a href="#contact">Contact</a>
  </nav>
</header>

<main class="container">
  <h1>Publications</h1>
  <p>Scientific publications from the Palikaras Lab.</p>

  <div id="publication-list"></div>
</main>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const container = document.getElementById("publication-list");
    const publications = window.labPublications || [];

    publications.forEach(function (paper, index) {
      const article = document.createElement("article");
      article.className = "publication";

      const title = document.createElement("h3");
      title.textContent = (index + 1) + ". " + (paper.title || "");
      article.appendChild(title);

      const authors = document.createElement("p");
      const authorText = paper.authors || "";
      const parts = authorText.split(/(Palikaras K\.?)/g);

      parts.forEach(function (part) {
        if (/^Palikaras K\.?$/.test(part)) {
          const strong = document.createElement("strong");
          strong.textContent = part;
          authors.appendChild(strong);
        } else {
          authors.appendChild(document.createTextNode(part));
        }
      });

      article.appendChild(authors);

      const journal = document.createElement("p");
      journal.textContent =
        (paper.journal || "") + " (" + (paper.year || "") + ")";
      article.appendChild(journal);

      if (paper.doi) {
        const link = document.createElement("a");
        link.href = "https://doi.org/" + paper.doi;
        link.textContent = "View publication";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        article.appendChild(link);
      }

      container.appendChild(article);
    });
  });
</script>

</body>
</html>
